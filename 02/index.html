<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paragraph — Play With Fit</title>
<style>
@font-face {
  font-family: "FitKannadaVF";
  src: url("../shared/fonts/FitKannadaVF.woff2") format("woff2");
  font-weight: 100 900; font-display: block;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
body { background: #000; font-family: system-ui, -apple-system, sans-serif; }

/* ── Control panel — top-right, always dark ── */
.ctrl-wrap {
  position: fixed; right: 16px; top: 16px;
  width: 300px; border-radius: 12px; overflow: hidden;
  background: rgba(18,18,18,0.88);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  z-index: 100;
}
.ctrl-wrap.hidden { display: none; }

.ctrl-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; cursor: pointer; user-select: none;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.ctrl-title {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .14em; color: rgba(255,255,255,0.45);
}
.ctrl-chevron {
  font-size: 10px; color: rgba(255,255,255,0.40);
  transition: transform .28s ease; line-height: 1;
}
.ctrl-body {
  overflow: hidden; max-height: 800px; opacity: 1;
  transition: max-height .32s cubic-bezier(.4,0,.2,1), opacity .22s;
}
.ctrl-body.collapsed { max-height: 0; opacity: 0; }
.ctrl-panel {
  display: flex; flex-direction: column; gap: 11px;
  padding: 14px 15px 15px; color: #fff; font-size: 12px;
}
.cg { display: flex; flex-direction: column; gap: 4px; }
.cl { margin: 0; font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .12em; color: rgba(255,255,255,0.42); }
.ct {
  width: 100%; border-radius: 8px; outline: none; padding: 7px 10px;
  font-size: 12px; font-family: system-ui, -apple-system, sans-serif;
  background: rgba(255,255,255,0.09); color: #fff;
  border: 1px solid rgba(255,255,255,0.13); transition: border-color .18s;
  resize: none; height: 60px;
}
.ct:focus { border-color: rgba(255,255,255,0.40); }
.cb {
  width: 100%; border-radius: 8px; outline: none; padding: 7px 11px;
  font-size: 12px; font-family: system-ui, -apple-system, sans-serif; cursor: pointer;
  text-align: left; background: rgba(255,255,255,0.09); color: #fff;
  border: 1px solid rgba(255,255,255,0.13); transition: background .14s, border-color .14s;
}
.cb:hover { border-color: rgba(255,255,255,.32); }
.cb-primary { text-align: center; font-weight: 600; background: #fff; color: #000; border-color: transparent; }
.cb-primary:hover { opacity: .88; }
.sw-row { display: flex; gap: 6px; flex-wrap: wrap; }
.sw {
  width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: border-color .14s, transform .14s; flex-shrink: 0;
}
.sw:hover { transform: scale(1.13); }
.sw.active { border-color: #fff !important; }

/* Sketch */
#editorial {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 8vh 6vw;
}
#para {
  max-width: 1800px; font-family: "FitKannadaVF";
  font-size: 5.5vw; line-height: 1.3; text-align: center;
}
.word {
  position: relative; display: inline-block;
  margin: .04em .06em; padding: .14em .18em;
  white-space: nowrap; cursor: ew-resize;
  user-select: none; touch-action: none;
  border: 2px solid rgba(255,255,255,0.12);
  color: var(--par, #000); z-index: 0; transition: border-color .13s;
}
.word::after { content: ''; position: absolute; inset: 0; background: var(--rect-color, transparent); z-index: -1; }
.word.active              { border-color: var(--outline, #fff); }
.word:hover:not(.active)  { border-color: rgba(255,255,255,0.30); }
.word::before {
  content: '↔'; position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
  font-size: 9px; opacity: 0; color: #fff; pointer-events: none; transition: opacity .13s;
}
.word:hover::before  { opacity: .35; }
.word.active::before { opacity: 0; }
</style>
</head>
<body>

<div id="editorial"><div id="para"></div></div>

<div id="ctrlWrap" class="ctrl-wrap">
  <div class="ctrl-header" id="ctrl-header">
    <span class="ctrl-title">Controls</span>
    <span class="ctrl-chevron">▲</span>
  </div>
  <div class="ctrl-body">
    <div class="ctrl-panel">
      <div class="cg">
        <p class="cl">Paragraph Text</p>
        <textarea id="textInput" class="ct"></textarea>
      </div>
      <div class="cg">
        <p class="cl">Theme</p>
        <div class="sw-row">
          <div class="sw active" data-i="0" style="background:#000;"></div>
          <div class="sw"        data-i="1" style="background:#e1ff4f;"></div>
          <div class="sw"        data-i="2" style="background:#00176a;"></div>
        </div>
      </div>
      <button id="reshuffleBtn" class="cb cb-primary">Reshuffle</button>
    </div>
  </div>
</div>

<script>
/* ── Collapse toggle ── */
(function () {
  const header  = document.getElementById('ctrl-header');
  const body    = document.querySelector('.ctrl-body');
  const chevron = header.querySelector('.ctrl-chevron');
  let expanded  = true;
  header.addEventListener('click', () => {
    expanded = !expanded;
    body.classList.toggle('collapsed', !expanded);
    chevron.style.transform = expanded ? '' : 'rotate(180deg)';
  });
})();

/* ── Sketch ── */
const WCHOICES = [200, 800, 1500, 2000];
const WMIN = 200, WMAX = 3600;
const DEFAULT = 'Fit ಕನ್ನಡ is gonna be the ಅತ್ಯಂತ ಪ್ರಸಿದ್ಧ typeface in ಬೆಂಗಳೂರು';

const THEMES = [
  { bg: '#000000', par: '#000000', outline: '#ffffff', palette: ['#0ff','#f0f','#ff0','#0f0','#f80'] },
  { bg: '#e1ff4f', par: '#e1ff4f', outline: '#000000', palette: ['#000'] },
  { bg: '#00176a', par: '#00176a', outline: '#f05ae4', palette: ['#f05ae4','#fff','#7b61ff'] },
];

let curTheme = THEMES[0], curText = DEFAULT;
const paraEl = document.getElementById('para');
const txtInp = document.getElementById('textInput');
txtInp.value = DEFAULT;

function rndColor() { const p = curTheme.palette; return p[Math.floor(Math.random() * p.length)]; }

function applySceneTheme(t) {
  document.body.style.background = t.bg;
  document.documentElement.style.setProperty('--par',     t.par);
  document.documentElement.style.setProperty('--outline', t.outline);
}

function buildPara() {
  paraEl.innerHTML = '';
  curText.split(/\s+/).filter(Boolean).forEach(word => {
    const sp = document.createElement('span');
    sp.className = 'word'; sp.textContent = word;
    const w = WCHOICES[Math.floor(Math.random() * WCHOICES.length)];
    sp.dataset.wdth = w;
    sp.style.fontVariationSettings = `"wdth" ${w}`;
    sp.style.setProperty('--rect-color', rndColor());
    enableDrag(sp);
    paraEl.appendChild(sp);
    paraEl.appendChild(document.createTextNode(' '));
  });
}

let activeW = null, startX = 0, startW = 0, dragging = false;
function enableDrag(el) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    if (activeW && activeW !== el) activeW.classList.remove('active');
    activeW = el; el.classList.add('active');
    dragging = true; startX = e.clientX; startW = parseFloat(el.dataset.wdth);
    document.body.style.cursor = 'ew-resize';
  });
}
document.addEventListener('pointerdown', e => {
  if (e.target.closest('.word')) return;
  if (activeW) { activeW.classList.remove('active'); activeW = null; }
});
window.addEventListener('pointermove', e => {
  if (!dragging || !activeW) return;
  const nw = Math.max(WMIN, Math.min(WMAX, startW + (e.clientX - startX) * 6));
  activeW.dataset.wdth = nw; activeW.style.fontVariationSettings = `"wdth" ${nw}`;
});
window.addEventListener('pointerup',     () => { dragging = false; document.body.style.cursor = ''; });
window.addEventListener('pointercancel', () => { dragging = false; document.body.style.cursor = ''; });

/* Swatches — scene only, panel stays dark */
document.querySelectorAll('.sw').forEach(sw => {
  sw.addEventListener('click', () => {
    document.querySelectorAll('.sw').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    curTheme = THEMES[parseInt(sw.dataset.i) || 0];
    applySceneTheme(curTheme);
    buildPara();
  });
});

applySceneTheme(curTheme);
txtInp.addEventListener('input', () => { curText = txtInp.value; buildPara(); });
document.getElementById('reshuffleBtn').addEventListener('click', () => buildPara());
document.fonts.ready.then(buildPara);

/* ── Ghost-cursor tutorial ─────────────────────────────────────── */
function runTutorial() {
  var words = document.querySelectorAll('.word');
  if (!words.length) return;
  var target = words[Math.floor(words.length / 2)];
  var rect = target.getBoundingClientRect();
  var cx = rect.left + rect.width / 2;
  var cy = rect.top  + rect.height / 2;
  var startW = parseFloat(target.dataset.wdth) || 800;

  var cur = document.createElement('div');
  cur.style.cssText = 'position:fixed;pointer-events:none;z-index:9999;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,0.88);box-shadow:0 0 0 3px rgba(255,255,255,0.22),0 2px 14px rgba(0,0,0,0.5);transform:translate(-50%,-50%);opacity:0;transition:opacity .35s;left:'+cx+'px;top:'+cy+'px';
  document.body.appendChild(cur);

  var hint = document.createElement('div');
  hint.textContent = 'drag horizontally';
  hint.style.cssText = 'position:fixed;pointer-events:none;z-index:9999;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,0.5);transform:translateX(-50%);opacity:0;transition:opacity .35s;font-family:system-ui,sans-serif;left:'+cx+'px;top:'+(cy-26)+'px';
  document.body.appendChild(hint);

  var t0 = null;
  function ease(t){ return t<.5?2*t*t:(4-2*t)*t-1; }

  function tick(ts) {
    if (!t0) t0 = ts;
    var t = ts - t0;
    if (t < 400) {
      var p = t/400; cur.style.opacity=p.toFixed(2); hint.style.opacity=(p*.75).toFixed(2);
    } else if (t < 700) {
      cur.style.opacity='1'; hint.style.opacity='0.75';
      target.classList.add('active');
      cur.style.transform='translate(-50%,-50%) scale(0.82)';
    } else if (t < 1500) {
      var p=ease((t-700)/800);
      cur.style.left=(cx+p*130)+'px'; cur.style.transform='translate(-50%,-50%) scale(0.82)';
      var nw=Math.min(3600,startW+p*2400); target.dataset.wdth=nw; target.style.fontVariationSettings='"wdth" '+nw;
    } else if (t < 2300) {
      var p=ease((t-1500)/800);
      cur.style.left=(cx+130-p*230)+'px';
      var nw=Math.max(200,startW+2400-p*2900); target.dataset.wdth=nw; target.style.fontVariationSettings='"wdth" '+nw;
    } else if (t < 2700) {
      var p=(t-2300)/400;
      cur.style.opacity=(1-p).toFixed(2); hint.style.opacity=((1-p)*.75).toFixed(2);
      cur.style.transform='translate(-50%,-50%) scale(1)'; target.classList.remove('active');
    } else {
      cur.remove(); hint.remove();
      localStorage.setItem('pwf-tut-sk02','1');
      return;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// Expose so parent iframe can call it via the Quick Tutorial button
window.sk02Tutorial = runTutorial;

// Auto-play on first visit
document.fonts.ready.then(function() {
  if (!localStorage.getItem('pwf-tut-sk02')) setTimeout(runTutorial, 1000);
});
</script>
</body>
</html>
